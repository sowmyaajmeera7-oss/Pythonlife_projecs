<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apllication Page</title>
</head>
<style>
    body{
        background-image: url("background-image.webp");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        height: 100vh;
    }
</style>
<body>
    <form>
        <label>First Name</label>
        <input type="text" name="Firstename" size="30"><br>
        <label>Last Name</label>
        <input type="text" name="Lastname" size="30"><br>
        <label>Course</label>
        <select>
            <option>SELECT OPTION</option>
            <option>CIVIL</option>
            <option>CSE</option>
            <option>EEE</option>
            <option>ECE</option>
        </select>
        <br>
        <label>Gender</label> <br>
        <input type="radio" name="gender"> Male <br>
        <input type="radio" name="gender"> Female <br>
        <input type="radio" name="gender"> Other <br>

        <label>PHONE NUMBERS</label> <br>
        <input type="text" name="county code" value="+91" size="1">
        <input type="text" name="phone" size="10"> <br>
        <label>ADDRESS</label> <br>
        <textarea cols="100" rows="8" value="address"></textarea> <br>
        <input type="button" value="submit">




    </form>
    
</body>
</html>
